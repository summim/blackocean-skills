name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Smoke test (start a real server with the mod)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\ngenerate-structures=false\n" > run/server.properties
          ( ./gradlew runServer --no-daemon > server.log 2>&1 & echo $! > server.pid )
          for i in $(seq 1 240); do
            if grep -q "Done (" server.log; then echo "SERVER STARTED"; break; fi
            if grep -qE "Crash report|Failed to load|Exception in server tick loop|ModLoadingException" server.log; then break; fi
            sleep 2
          done
          sleep 15
          pkill -f "net.neoforged" || true; kill $(cat server.pid) 2>/dev/null || true
          echo "----- mod lines -----"; grep -iE "blackocean|ERROR|Exception" server.log | head -80 || true
          grep -q "Done (" server.log
          if grep -iE "blackocean" server.log | grep -qiE "error|exception"; then echo "MOD ERROR FOUND"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: blackocean_skills-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish jar to dist branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/dist && cp build/libs/*.jar /tmp/dist/
          cd /tmp/dist
          git init -q -b dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" dist
